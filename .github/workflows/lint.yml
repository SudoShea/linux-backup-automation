# ==============================================================================
# GitHub Action : .github/workflows/lint.yml
# Description   : Runs ansible-lint to enforce syntax and best practices
# Author        : SudoShea
# Version       : 0.1.0
# License       : MIT
# ==============================================================================
name: Ansible Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Run Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-lint

      - name: Run ansible-lint
        uses: ansible/ansible-lint@main
